<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* 名刺サイズ 91×55mm（300dpi で 1075×650px。1mm ≒ 11.8px）
     色は買取大吉VIガイドライン ver3.04 のコーポレートカラー
     ・ロゴ最小サイズ：ヨコ組みは高さ12mm以上 → 高さ150px（約12.7mm）
     ・ロゴ周りの余白：高さの25%以上 → 38px以上 */
  * { box-sizing: border-box; margin: 0; }
  body { width: 1075px; height: 650px; font-family: "Noto Sans JP", sans-serif; }
  .card { width: 100%; height: 100%; background: #2f3185; color: #fff; padding: 40px 48px; display: flex; flex-direction: column; gap: 40px; }
  .top { display: flex; align-items: center; gap: 44px; }
  .logo { display: block; height: 150px; width: auto; }
  .store { color: #d2d5ec; font-size: 30px; font-weight: 700; letter-spacing: .1em; line-height: 1.3; }
  .bottom { flex: 1; display: flex; align-items: center; gap: 40px; }
  .text { flex: 1; }
  h1 { font-size: 44px; line-height: 1.3; font-weight: 700; }
  .bar { width: 100px; height: 5px; background: #ff0001; border-radius: 3px; margin: 18px 0 14px; }
  .how { font-size: 24px; line-height: 1.6; color: #e6e8f2; }
  .qr { background: #fff; border-radius: 20px; padding: 14px 14px 8px; text-align: center; }
  .qr img { width: 250px; height: 250px; display: block; }
  .qr p { color: #2f3185; font-size: 19px; font-weight: 700; }
</style></head>
<body><div class="card">
  <div class="top">
    <img class="logo" src="../assets/logo_h_blue.png" alt="買取大吉">
    <div class="store">川内<br>大小路店</div>
  </div>
  <div class="bottom">
    <div class="text">
      <h1>ご感想を<br>お聞かせください</h1>
      <div class="bar"></div>
      <p class="how">スマホをカードにかざすか、<br>QRコードを読み取ってください</p>
    </div>
    <div class="qr"><img src="qr.png"><p>Googleマップ口コミ</p></div>
  </div>
</div></body></html>
