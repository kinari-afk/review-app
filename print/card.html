<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  /* 名刺サイズ 91×55mm（300dpi で 1075×650px） */
  * { box-sizing: border-box; margin: 0; }
  body { width: 1075px; height: 650px; font-family: "Hiragino Sans","Noto Sans JP","Noto Sans CJK JP",sans-serif; }
  .card { width: 100%; height: 100%; background: #1f2a5c; color: #fff; display: flex; align-items: center; padding: 60px 64px; gap: 56px; }
  .text { flex: 1; }
  .store { color: #c9a227; font-size: 30px; letter-spacing: .08em; }
  h1 { font-size: 54px; line-height: 1.35; margin: 18px 0 22px; }
  .stars { width: 120px; height: 5px; background: #c9a227; border-radius: 3px; }
  .how { font-size: 27px; line-height: 1.6; margin-top: 20px; color: #e6e8f2; }
  .qr { background: #fff; border-radius: 24px; padding: 20px; text-align: center; }
  .qr img { width: 330px; height: 330px; display: block; }
  .qr p { color: #1f2a5c; font-size: 24px; font-weight: bold; margin-top: 6px; }
</style></head>
<body><div class="card">
  <div class="text">
    <div class="store">買取大吉 川内大小路店</div>
    <h1>ご感想を<br>お聞かせください</h1>
    <div class="stars"></div>
    <p class="how">スマホをカードにかざすか、<br>QRコードを読み取ってください</p>
  </div>
  <div class="qr"><img src="qr.png"><p>Googleマップ口コミ</p></div>
</div></body></html>
